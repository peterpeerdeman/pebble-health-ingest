[package]
name = "pebble-ingest"
version = "1.0.0"
edition = "2021"
description = "Pebble Health -> InfluxDB 1.8 ingest service"
license = "MIT"
repository = "https://github.com/peterpeerdeman/pebble-health-ingest"
publish = false

[dependencies]
anyhow = "1"
axum = "0.8"
# Influx is reached over plain HTTP inside the compose network, so no TLS stack:
# keeps the binary pure Rust and trivially cross-compilable (i386/arm64).
reqwest = { version = "0.13", default-features = false, features = ["json", "query"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"

[profile.release]
lto = true
codegen-units = 1
strip = true
